name: Django REST Framework Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run_tests:
    runs-on: ubuntu-latest

    env:
      # Common environment variables your Django settings might need
      SECRET_KEY: ci-test-secret-key-never-use-in-production
      DEBUG: "False"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Change to your project's Python version
          cache: 'pip'          # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: python manage.py test